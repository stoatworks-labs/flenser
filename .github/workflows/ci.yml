name: ci

# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # FLENSER_BUILD_TOOLS is ON here where the release build turns it OFF:
        # fltest is a large slice of the C++, it is the only place the plugin's
        # maths is written down twice, and `--cells` and `--presets` both run
        # without a GL context — so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DFLENSER_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The checks that need no GPU: the parameter plumbing, and both halves of
      # the browser demo. Deliberately NOT --field or --null, which need a real
      # context — a CI runner's GL is a software rasteriser at best, and a red
      # build that only means "no GPU here" is a red build people learn to
      # ignore.
      #
      # tools/verify.sh runs all of them locally, and that is where the
      # picture-level checks belong.
      - name: Checks that need no GPU
        run: |
          ./build/fltest --presets
          python3 demo/tools/check_shaders.py
          node demo/tools/check_cells.mjs

      # The OpenFX bundle names its own binary. This is a release-time codesign
      # failure with no local symptom at all — see the comment in
      # cmake/InfoOFX.plist.in — so it is worth a line here as well as in
      # verify.sh.
      - name: OpenFX bundle names its own binary
        run: |
          named=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" \
            build/Flenser.ofx.bundle/Contents/Info.plist)
          test -f "build/Flenser.ofx.bundle/Contents/MacOS/$named"
          echo "CFBundleExecutable is $named, and it is there"

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: flenser-macos-arm64
          path: |
            build/*.bundle
            build/*.ofx.bundle
          if-no-files-found: error
