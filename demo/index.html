  <body>
    <main id="demo">
      <noscript>
        <h1>Flenser</h1>
        <p>
          Oil, water, alcohol and dye squashed between two watch glasses on an
          overhead projector: the 1967 liquid light show, as an FFGL source and
          a matching effect that puts your clip where the lamp was. The cells
          are dye filters, so where they cross they multiply rather than add.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/flenser">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/flenser/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/flenser/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/flenser">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>

      src="./vendor/support-footer.js"
